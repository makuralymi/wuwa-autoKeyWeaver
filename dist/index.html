<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>曲谱编辑器</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎵 曲谱编辑器</h1>
    <span id="status" class="status"></span>
    <span id="game-indicator" class="game-indicator" title="检测鸣潮游戏进程">🎮 检测中…</span>
  </header>

  <main>
    <!-- 工具栏 -->
    <section class="panel toolbar">
      <label class="field">
        <span>每小节拍数</span>
        <input id="measure-input" type="number" min="1" max="16" value="4" />
        <button id="apply-measure" class="btn small">应用</button>
      </label>
      <label class="field">
        <span>速度 BPM</span>
        <input id="bpm-input" type="number" min="20" max="600" value="120" />
      </label>
      <label class="field">
        <span>倒计时</span>
        <input id="countdown-input" type="number" min="0" max="60" value="3" />
        <span>秒</span>
      </label>
      <div class="spacer"></div>
      <button id="btn-overlay" class="btn">🪟 悬浮窗</button>
      <button id="btn-play" class="btn primary">▶ 播放</button>
      <button id="btn-preview" class="btn">🎧 试听</button>
      <button id="btn-stop" class="btn danger" disabled>■ 停止</button>
      <div class="sep"></div>
      <button id="btn-export" class="btn">导出</button>
      <button id="btn-import" class="btn">导入</button>
      <input id="import-file" type="file" accept=".json,application/json" hidden />
    </section>

    <!-- 音符面板（按键映射） -->
    <section class="panel palette">
      <div class="palette-hint">点击下方音符为选中拍添加/移除该音（可组成和弦，如括号记谱），也可直接按键盘对应字母键</div>
      <div class="palette-grid" id="palette"></div>
    </section>

    <!-- 谱面切换 + 曲谱网格 -->
    <section class="panel score">
      <div id="song-tabs" class="song-tabs"></div>
      <div class="score-tools">
        <div id="duration-bar" class="duration-bar"></div>
        <div class="spacer"></div>
        <span class="total-beats">共 <b id="total-beats">0</b> 拍</span>
        <button id="btn-add-note" class="btn small">＋ 音符</button>
        <button id="btn-del-note" class="btn small danger">－ 删除</button>
      </div>
      <div class="score-hint">
        点格子选中 · 字母键/音符面板填音 · 选「时长」设置时值 · ←/→ 移动 · Delete 清空和弦 · 空格/0 清空并前进
      </div>
      <div id="score-grid" class="score-grid"></div>
    </section>
  </main>

  <footer>
    按键映射：低八度 <b>Z X C V B N M</b> · 中八度 <b>A S D F G H J</b> · 高八度 <b>Q W E R T Y U</b>
    （键盘字母区每排从左到右 7 键）
  </footer>

  <!-- 退出确认弹窗（Tauri 模式关闭主窗口时显示） -->
  <div id="exit-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-title">退出应用</div>
      <div class="modal-text">退出后将结束全部进程；也可以最小化到系统托盘继续运行。</div>
      <div class="modal-actions">
        <button id="btn-exit-full" class="btn danger">完全退出</button>
        <button id="btn-exit-tray" class="btn">最小化到托盘</button>
        <button id="btn-exit-cancel" class="btn">取消</button>
      </div>
    </div>
  </div>

  <script src="store.js"></script>
  <script src="audio.js"></script>
  <script src="app.js"></script>
</body>
</html>
